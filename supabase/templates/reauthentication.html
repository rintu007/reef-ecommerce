<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="margin:0;padding:0;background-color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef2f6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(23,29,38,0.08);">
            <tr>
              <td style="background:linear-gradient(135deg,#0b81b7,#0a4a6b);padding:36px 32px 30px;text-align:center;">
                <div style="font-size:34px;line-height:1;margin-bottom:10px;">&#127748;</div>
                <div style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.3px;">Reef Market</div>
                <div style="font-size:13px;color:rgba(255,255,255,0.75);margin-top:4px;">The aquarium hobbyist marketplace</div>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 32px;">
                <h1 style="margin:0 0 12px;font-size:21px;font-weight:800;color:#171d26;">Confirm it's you</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.65;color:#475569;">Enter this code to confirm this sensitive action on your Reef Market account.</p>
                <div style="text-align:center;margin:8px 0 20px;"><span style="display:inline-block;padding:16px 28px;background-color:#f8fafc;border:1px solid #e0e6eb;border-radius:10px;font-size:28px;font-weight:800;letter-spacing:6px;color:#171d26;">{{ .Token }}</span></div>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#94a3b8;">If you didn't request this, you can safely ignore this email.</p>

              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px;border-top:1px solid #eef2f6;text-align:center;">
                <div style="font-size:12px;color:#94a3b8;">Reef Market &mdash; built for aquarium hobbyists.</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
